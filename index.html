<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>1 Hour of Silence</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f4f2;--fg:#1a1a1a;--mut:#777;--card:#fff;--bd:#ddd;--ac:#b3261e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0b0d;--fg:#d8d8d8;--mut:#888;--card:#141417;--bd:#26262b;--ac:#e5484d}}
:root[data-theme="dark"]{--bg:#0b0b0d;--fg:#d8d8d8;--mut:#888;--card:#141417;--bd:#26262b;--ac:#e5484d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:24px 18px 48px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
h1{font-weight:300;letter-spacing:.08em;font-size:1.5rem;margin:8px 0 4px}
p.sub{color:var(--mut);margin:0 0 20px;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
button,select{font:inherit;color:var(--fg);background:transparent;border:1px solid var(--bd);border-radius:8px;padding:6px 12px;cursor:pointer}
button.big{width:100%;padding:16px;font-size:1.1rem;background:var(--ac);color:#fff;border-color:var(--ac)}
button.big.on{background:transparent;color:var(--ac)}
label{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:10px 0;font-size:.9rem}
.val{background:transparent;border:0;border-bottom:1px solid transparent;border-radius:0;color:inherit;font:inherit;text-align:right;width:100%;padding:0;outline:none;cursor:text;font-variant-numeric:tabular-nums}.val:hover{border-bottom-color:var(--bd)}.val:focus{border-bottom-color:var(--ac)}.r{display:grid;grid-template-columns:72px minmax(0,1fr) 78px;align-items:center;gap:10px;margin:10px 0;font-size:.9rem}.r input{width:100%;min-width:0;margin:0}.r span{text-align:right;font-variant-numeric:tabular-nums}
h4{margin:12px 0 2px;font-size:.85rem;font-weight:600;color:var(--mut)}
.snd{display:flex;align-items:center;gap:6px;margin:4px 0;font-size:.9rem}
.snd span,.snd .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}.snd .nm{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--ac);border-radius:6px;padding:3px 6px}.snd button{padding:2px 9px}
#status{text-align:center;color:var(--mut);font-size:.9rem;margin:10px 0;min-height:1.4em}
#log{font-size:.8rem;color:var(--mut);max-height:120px;overflow:auto;margin:0;padding-left:16px}
.warn{font-size:.8rem;color:var(--mut)}
[hidden]{display:none!important}
</style></head><body><main>
<div class="top"><div><h1 data-i="title"></h1><p class="sub" data-i="sub"></p></div>
<select id="lang" aria-label="Language"><option value="en">English</option><option value="pt">Português</option><option value="es">Español</option><option value="ja">日本語</option></select></div>

<div class="card">
<button class="big" id="go"></button>
<div id="status"></div>
<div class="warn" data-i="warn"></div>
</div>

<div class="card">
<label><span data-i="mode"></span>
<select id="mode"><option value="range" data-i="mRange"></option><option value="chaos" data-i="mChaos"></option><option value="blind" data-i="mBlind"></option></select></label>
<div id="gapctl">
<div class="r"><span style="text-align:left" data-i="min"></span><input type="range" id="min" min="1" max="3600" value="20"><input class="val" id="minv" autocomplete="off" spellcheck="false"></div>
<div class="r"><span style="text-align:left" data-i="max"></span><input type="range" id="max" min="1" max="3600" value="180"><input class="val" id="maxv" autocomplete="off" spellcheck="false"></div>
<label><span data-i="peek"></span><input type="checkbox" id="peek"></label>
<button id="rand" data-i="rand"></button>
</div>
<div class="r"><span style="text-align:left" data-i="vol"></span><input type="range" id="vol" min="0" max="100" value="50"><span id="volv"></span></div>
<label><span data-i="dim"></span><input type="checkbox" id="dim"></label>
</div>

<div class="card">
<div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><b data-i="sounds"></b><span><button id="all" data-i="all"></button> <button id="offAll" data-i="offAll"></button></span></div>
<div id="sounds"></div>
<h4 id="ch" hidden data-i="yours"></h4><div id="csounds"></div>
</div>

<div class="card">
<b data-i="add"></b>
<p class="warn" data-i="addNote"></p>
<input type="file" id="file" accept="audio/*" multiple>
<div id="custom" class="warn"></div>
</div>

<div class="card"><b data-i="logT"></b><ol id="log"></ol></div>
</main>
<div id="veil" style="position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity 4s"></div>

en:{title:"1 HOUR OF SILENCE",sub:"Sit quietly. Something will happen. Eventually.",go:"Begin",stop:"Stop",idle:"Idle",stopped:"Stopped",listen:"Listening…",next:"Next in ",warn:"⚠ Sounds can be loud and startling. Set your volume low first. Nothing plays until you press Begin. Esc stops everything.",mode:"Timing mode",mRange:"Range: random between min and max",mChaos:"Chaos: unpredictable, with bait and bursts",mBlind:"Blind: hidden gaps, re-rolled in secret",min:"Min gap",max:"Max gap",peek:"Show countdown (spoils the fear)",rand:"🎲 Randomize the sliders",vol:"Volume",dim:"Fade screen to black",sounds:"Sounds",yours:"YOUR SOUNDS",add:"Add your own sounds",addNote:"Download clips from myinstants.com (or anywhere) and add them here. They are saved permanently in this browser (this device only). You can preview, rename, disable or remove them.",logT:"Log",all:"All",offAll:"None",edit:"Click to type a time (e.g. 90, 5m, 1h30m)",pipe:"Metal pipe",prev:"Preview",ren:"Rename",rm:"Remove",none:"No sounds enabled",bad:"Couldn't decode ",nosave:"Saving isn't available in this browser, so your sounds will only last until you close the page."},
pt:{title:"1 HORA DE SILÊNCIO",sub:"Fique quieto. Algo vai acontecer. Em algum momento.",go:"Começar",stop:"Parar",idle:"Parado",stopped:"Parado",listen:"Ouvindo…",next:"Próximo em ",warn:"⚠ Os sons podem ser altos e assustadores. Deixe o volume baixo antes. Nada toca até você apertar Começar. Esc para tudo.",mode:"Modo de tempo",mRange:"Intervalo: aleatório entre mín. e máx.",mChaos:"Caos: imprevisível, com iscas e rajadas",mBlind:"Cego: intervalos ocultos, sorteados em segredo",min:"Espera mín.",max:"Espera máx.",peek:"Mostrar contagem (estraga o susto)",rand:"🎲 Sortear os controles",vol:"Volume",dim:"Escurecer a tela",sounds:"Sons",yours:"SEUS SONS",add:"Adicione seus sons",addNote:"Baixe áudios do myinstants.com (ou de qualquer lugar) e adicione aqui. Ficam salvos permanentemente neste navegador (só neste aparelho). Dá para ouvir, renomear, desativar ou remover.",logT:"Registro",all:"Todos",offAll:"Nenhum",edit:"Clique para digitar um tempo (ex.: 90, 5m, 1h30m)",pipe:"Cano de metal",prev:"Ouvir",ren:"Renomear",rm:"Remover",none:"Nenhum som ativado",bad:"Não foi possível ler ",nosave:"Este navegador não permite salvar; seus sons duram só até fechar a página."},
es:{title:"1 HORA DE SILENCIO",sub:"Siéntate en silencio. Algo va a pasar. Tarde o temprano.",go:"Empezar",stop:"Detener",idle:"En espera",stopped:"Detenido",listen:"Escuchando…",next:"Siguiente en ",warn:"⚠ Los sonidos pueden ser fuertes y asustar. Baja el volumen antes. Nada suena hasta que pulses Empezar. Esc lo detiene todo.",mode:"Modo de tiempo",mRange:"Rango: aleatorio entre mín. y máx.",mChaos:"Caos: impredecible, con señuelos y ráfagas",mBlind:"Ciego: intervalos ocultos, sorteados en secreto",min:"Espera mín.",max:"Espera máx.",peek:"Mostrar cuenta atrás (arruina el susto)",rand:"🎲 Aleatorizar controles",vol:"Volumen",dim:"Oscurecer la pantalla",sounds:"Sonidos",yours:"TUS SONIDOS",add:"Añade tus sonidos",addNote:"Descarga audios de myinstants.com (o de donde quieras) y añádelos aquí. Se guardan de forma permanente en este navegador (solo en este dispositivo). Puedes escucharlos, renombrarlos, desactivarlos o eliminarlos.",logT:"Registro",all:"Todos",offAll:"Ninguno",edit:"Haz clic para escribir un tiempo (p. ej.: 90, 5m, 1h30m)",pipe:"Tubo de metal",prev:"Escuchar",ren:"Renombrar",rm:"Eliminar",none:"No hay sonidos activados",bad:"No se pudo leer ",nosave:"Este navegador no permite guardar; tus sonidos duran solo hasta cerrar la página."},
ja:{title:"1時間の静寂",sub:"静かに座って。何かが起こります。いつかは。",go:"開始",stop:"停止",idle:"待機中",stopped:"停止しました",listen:"待機中…",next:"次まで ",warn:"⚠ 大きな音で驚くことがあります。先に音量を下げてください。開始を押すまで鳴りません。Escで全停止。",mode:"タイミング",mRange:"範囲：最小〜最大でランダム",mChaos:"カオス：予測不能（フェイントと連続あり）",mBlind:"ブラインド：間隔は非表示、内部でランダム変更",min:"最小間隔",max:"最大間隔",peek:"カウントダウンを表示（怖さが減ります）",rand:"🎲 スライダーをランダム化",vol:"音量",dim:"画面を暗くする",sounds:"サウンド",yours:"あなたのサウンド",add:"サウンドを追加",addNote:"myinstants.comなどから音声をダウンロードして追加してください。このブラウザ（この端末のみ）に永続保存されます。試聴・名前変更・無効化・削除ができます。",logT:"ログ",all:"すべて",offAll:"解除",edit:"クリックして時間を入力（例：90、5m、1h30m）",pipe:"金属パイプ",prev:"試聴",ren:"名前変更",rm:"削除",none:"有効なサウンドがありません",bad:"読み込めません：",nosave:"このブラウザでは保存できません。ページを閉じるまでの一時的な保存になります。"}};
const nav=(navigator.language||"en").slice(0,2);
let cfg={};try{cfg=JSON.parse(localStorage.getItem("silence")||"{}")}catch(e){}
let lang=cfg.lang||(T[nav]?nav:"en");
const t=k=>(T[lang]&&T[lang][k])||T.en[k];

let ctx,master,running=false,timer,tick,nextAt=0,count=0,pipeBuf=null,pipeOn=cfg.pipeOn!==false,persist=true;
const custom=[],blind={a:20,b:200};
const fmt=s=>{s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return(h?h+"h":"")+(m?(h?" ":"")+m+"m":"")+(x||!(h||m)?(h||m?" ":"")+x+"s":"")};
function parseT(v){v=v.trim().toLowerCase().replace(",",".");if(!v)return NaN;
  if(/^\d+(\.\d+)?$/.test(v))return +v;
  if(/^\d+:\d+(:\d+)?$/.test(v)){const p=v.split(":").map(Number);return p.length===3?p[0]*3600+p[1]*60+p[2]:p[0]*60+p[1]}
  const re=/(\d+(?:\.\d+)?)\s*(h|m|s)[a-z]*/g;if(v.replace(re,"").trim())return NaN;
  let tot=0,m;while(m=re.exec(v))tot+=m[1]*({h:3600,m:60,s:1})[m[2]];return tot}
const R=(a,b)=>a+Math.random()*(b-a);

function init(){
  if(ctx)return;
  ctx=new (window.AudioContext||window.webkitAudioContext)();
  master=ctx.createGain();master.connect(ctx.destination);setVol();
  const bin=atob(PIPE_B64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
  ctx.decodeAudioData(u.buffer).then(b=>pipeBuf=b).catch(()=>{});
}
function setVol(){if(master)master.gain.value=Math.pow($("vol").value/100,2)}
function play(c){init();if(ctx.state==="suspended")ctx.resume();
  const b=c===0?pipeBuf:c.buf;if(!b)return;
  const s=ctx.createBufferSource(),p=ctx.createStereoPanner();p.pan.value=R(-.7,.7);s.buffer=b;s.connect(p);p.connect(master);s.start()}
const nameOf=c=>c===0?t("pipe"):c.name;
function save(){try{localStorage.setItem("silence",JSON.stringify({lang,pipeOn,mode:$("mode").value,min:$("min").value,max:$("max").value,vol:$("vol").value,dim:$("dim").checked,peek:$("peek").checked}))}catch(e){}}

function row(name,checked,onchg,prev,rename,rm){
  const d=document.createElement("div");d.className="snd";
  d.innerHTML="<input type=checkbox><span></span><button></button>";
  const cb=d.children[0],sp=d.children[1],pb=d.children[2];
  cb.checked=checked;cb.onchange=e=>onchg(e.target.checked);sp.textContent=name;pb.textContent="▶";pb.title=t("prev");pb.onclick=prev;
  if(rename){const b=document.createElement("button");b.textContent="✎";b.title=t("ren");
    b.onclick=()=>{const i=document.createElement("input");i.className="nm";i.value=name;i.maxLength=60;sp.replaceWith(i);i.focus();i.select();
      let done=false;const fin=ok=>{if(done)return;done=true;const v=i.value.trim();if(ok&&v)rename(v);renderAll()};
      i.onkeydown=e=>{if(e.key==="Enter")fin(true);if(e.key==="Escape")fin(false)};i.onblur=()=>fin(true)};d.appendChild(b)}
  if(rm){const x=document.createElement("button");x.textContent="✕";x.title=t("rm");x.onclick=rm;d.appendChild(x)}
  return d}
function renderAll(){
  const s=$("sounds");s.innerHTML="";
  s.appendChild(row(t("pipe"),pipeOn,v=>{pipeOn=v;save()},()=>play(0)));
  const box=$("csounds");box.innerHTML="";$("ch").hidden=!custom.length;
  custom.forEach(c=>box.appendChild(row(c.name,c.on,v=>{c.on=v;put(c)},()=>play(c),v=>{c.name=v;put(c)},async()=>{
    custom.splice(custom.indexOf(c),1);if(persist&&c.id!=null)try{await DB.tx("readwrite",s=>s.delete(c.id))}catch(e){}renderAll()})));
}
function applyLang(){
  document.documentElement.lang=lang;document.title=t("title").replace(/^./,c=>c);
  document.querySelectorAll("[data-i]").forEach(e=>e.textContent=t(e.dataset.i));
  $("lang").value=lang;$("minv").title=$("maxv").title=t("edit");$("go").textContent=t(running?"stop":"go");
  if(!running)$("status").textContent=t("idle");renderAll();
}

function log(n){const li=document.createElement("li");li.textContent=new Date().toLocaleTimeString()+" — "+n;$("log").prepend(li)}
function fire(){
  const pool=[...(pipeOn&&pipeBuf?[0]:[]),...custom.filter(c=>c.on)];
  if(!pool.length){log(t("none"));return}
  const p=pool[Math.floor(Math.random()*pool.length)];play(p);log(nameOf(p));
}
function roll(){blind.a=R(5,60);blind.b=blind.a+R(60,900)}
function gap(){
  const m=$("mode").value;let a=+$("min").value,b=Math.max(a,+$("max").value);
  if(m==="blind"){a=blind.a;b=blind.b}
  if(m==="chaos"){const r=Math.random();if(r<.2)return R(2,10);if(r<.75)return R(a,b);return b*R(1,2)}
  return R(a,b);
}
function schedule(){
  const w=gap();nextAt=Date.now()+w*1000;
  timer=setTimeout(()=>{fire();count++;const m=$("mode").value;
    if(m==="chaos"&&Math.random()<.12)setTimeout(fire,R(800,3000));
    if(m==="blind"&&count%5===0)roll();
    if(running)schedule()},w*1000);
}
function start(){
  init();ctx.resume();running=true;count=0;roll();
  $("go").textContent=t("stop");$("go").classList.add("on");
  if($("dim").checked)$("veil").style.opacity=.92;
  schedule();
  tick=setInterval(()=>{const show=$("peek").checked&&$("mode").value==="range";
    $("status").textContent=show?t("next")+fmt(Math.max(0,(nextAt-Date.now())/1000)):t("listen")},500);
  try{navigator.wakeLock&&navigator.wakeLock.request("screen").catch(()=>{})}catch(e){}
}
function stop(){running=false;clearTimeout(timer);clearInterval(tick);$("go").textContent=t("go");$("go").classList.remove("on");$("status").textContent=t("stopped");$("veil").style.opacity=0}
$("go").onclick=()=>running?stop():start();
document.addEventListener("keydown",e=>{if(e.key==="Escape")stop()});
$("dim").onchange=()=>{save();if(running)$("veil").style.opacity=$("dim").checked?.92:0};
$("mode").onchange=()=>{$("gapctl").hidden=$("mode").value==="blind";save()};
$("lang").onchange=e=>{lang=e.target.value;save();applyLang()};
$("rand").onclick=()=>{const a=Math.round(R(5,120));$("min").value=a;$("max").value=Math.round(a+R(30,900));$("min").oninput()};
const sync=()=>{$("minv").value=fmt(+$("min").value);$("maxv").value=fmt(+$("max").value);$("volv").textContent=$("vol").value+"%";setVol()};
["min","max","vol"].forEach(id=>$(id).oninput=()=>{
  if(id==="min"&&+$("min").value>+$("max").value)$("max").value=$("min").value;
  if(id==="max"&&+$("max").value<+$("min").value)$("min").value=$("max").value;
  sync();save()});
["min","max"].forEach(id=>{const el=$(id+"v");
  el.onfocus=()=>el.select();
  el.onkeydown=e=>{if(e.key==="Enter")el.blur();if(e.key==="Escape"){sync();el.blur()}};
  el.onchange=()=>{let v=parseT(el.value);if(isNaN(v)){sync();return}
    $(id).value=Math.min(3600,Math.max(1,Math.round(v)));$(id).oninput()};
  el.onblur=sync});
$("peek").onchange=save;
const setAll=v=>{pipeOn=v;custom.forEach(c=>{c.on=v;put(c)});save();renderAll()};
$("all").onclick=()=>setAll(true);$("offAll").onclick=()=>setAll(false);
if(cfg.mode){$("mode").value=cfg.mode;$("mode").onchange()}
if(cfg.min){$("min").value=cfg.min;$("max").value=cfg.max;$("vol").value=cfg.vol;$("dim").checked=!!cfg.dim;$("peek").checked=!!cfg.peek}
$("min").oninput();

const DB={open(){return new Promise((res,rej)=>{const r=indexedDB.open("silence",1);r.onupgradeneeded=()=>r.result.createObjectStore("sounds",{keyPath:"id",autoIncrement:true});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
 async tx(mode,fn){const d=await this.open();return new Promise((res,rej)=>{const x=d.transaction("sounds",mode),q=fn(x.objectStore("sounds"));x.oncomplete=()=>res(q&&q.result);x.onerror=()=>rej(x.error)})}};
const noSave=()=>{persist=false;$("custom").textContent=t("nosave")};
function put(c){if(persist&&c.id!=null)DB.tx("readwrite",s=>s.put({id:c.id,name:c.name,data:c.data,on:c.on})).catch(()=>{})}
async function loadCustom(){
  try{const recs=await DB.tx("readonly",s=>s.getAll());init();
    for(const r of recs){try{custom.push({...r,buf:await ctx.decodeAudioData(r.data.slice(0))})}catch(e){}}renderAll()}
  catch(e){noSave()}
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
}
$("file").onchange=async e=>{init();const bad=[];
  for(const f of e.target.files){try{
    const data=await f.arrayBuffer(),buf=await ctx.decodeAudioData(data.slice(0)),c={name:f.name.replace(/\.[^.]+$/,""),data,buf,on:true};
    if(persist)try{c.id=await DB.tx("readwrite",s=>s.add({name:c.name,data,on:true}))}catch(err){noSave()}
    custom.push(c)}catch(err){bad.push(f.name)}}
  renderAll();e.target.value="";if(bad.length)$("custom").textContent=t("bad")+bad.join(", ")};
applyLang();init();loadCustom();
</script></body></html>
